[package]
name = "apple-log"
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/doom-fish/apple-log-rs"
repository = "https://github.com/doom-fish/apple-log-rs"
description = "Safe Rust bindings for Apple's os_log — structured logging, signposts, and activity ids on macOS"
authors = ["Per Johansson <per@doom.fish>"]
keywords = ["log", "logging", "os-log", "macos", "console"]
categories = ["api-bindings", "os::macos-apis", "development-tools::debugging"]
rust-version = "1.76"
readme = "README.md"
build = "build.rs"
include = [
    "src/**/*",
    "examples/**/*",
    "tests/**/*",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE-*",
    "CHANGELOG.md",
]

[lints.rust]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

[lib]
name = "apple_log"
crate-type = ["lib"]

[build-dependencies]
cc = "1"

[dependencies]

[dev-dependencies]
regex-lite = "0.1"

[package.metadata.docs.rs]
all-features = true
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
rustdoc-args = ["--cfg", "docsrs"]

[badges]
maintenance = { status = "actively-developed" }

[[example]]
name = "01_basic_log"

[[example]]
name = "02_signposts"

[[example]]
name = "03_privacy_and_activity"

[profile.release]
debug = "full"
strip = "none"
