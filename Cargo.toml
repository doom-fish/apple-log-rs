[package]
name = "apple-log"
version = "0.5.1"
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/doom-fish/apple-log-rs"
repository = "https://github.com/doom-fish/apple-log-rs"
description = "Safe Rust bindings for Apple's os / OSLog APIs on macOS"
authors = ["Per Johansson <per@doom.fish>"]
keywords = ["log", "logging", "os-log", "macos", "console"]
categories = ["api-bindings", "os::macos-apis", "development-tools::debugging"]
rust-version = "1.76"
readme = "README.md"
build = "build.rs"
include = [
    "src/**/*",
    "swift-bridge/**/*",
    "examples/**/*",
    "tests/**/*",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "COVERAGE.md",
    "LICENSE-*",
]

[features]
default = ["raw-ffi"]
raw-ffi = []

[lints.rust]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

[lib]
name = "apple_log"
crate-type = ["lib"]

[dependencies]

[dev-dependencies]
regex-lite = "0.1"

[package.metadata.docs.rs]
all-features = true
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
rustdoc-args = ["--cfg", "docsrs"]

[badges]
maintenance = { status = "actively-developed" }

[profile.release]
debug = "full"
strip = "none"
